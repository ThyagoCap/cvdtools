[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cvdtools"
version = "0.13.1"
description = "Pipeline de análises CVD/DCVD (NSG) - biblioteca interna"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "openpyxl",
    "pyyaml",
]

[project.optional-dependencies]
# OrcFxAPI vem com a instalação do OrcaFlex (ou "pip install OrcFxAPI").
# Fica opcional para que os testes que não usam OrcaFlex rodem em qualquer máquina.
orcaflex = ["OrcFxAPI"]
dev = ["pytest"]

[project.scripts]
cvd = "cvdtools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cvdtools = ["templates/scripts/*.py", "templates/scripts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "orcaflex: precisa do OrcFxAPI e de licença do OrcaFlex",
    "baseline: precisa do baseline capturado em baseline/",
]
